# Lakeflow Declarative Pipeline (DLT) for the bakery-sales medallion.
# Direct publishing mode: each SQL file names its own bronze/silver/gold schema
# under the catalog below. Schemas are created by the pipeline on first run.
resources:
  pipelines:
    bakehouse_sales:
      name: bakehouse_sales_medallion
      catalog: ${var.catalog}
      serverless: true
      continuous: false
      libraries:
        - glob:
            include: ../src/bronze/*.sql
        - glob:
            include: ../src/silver/*.sql
        - glob:
            include: ../src/gold/*.sql
