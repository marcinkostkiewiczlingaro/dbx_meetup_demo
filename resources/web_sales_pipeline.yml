# Lakeflow Declarative Pipeline (DLT) for the web-sales medallion.
# Builds the web-sales and web-returns facts and the web-only dimensions — web site and
# web page — through bronze, silver, and gold. The gold enriched table reads the conformed
# core dims (customer, item, date, promotion) owned by the core pipeline; reads across
# pipelines are fine, it never rebuilds them.
resources:
  pipelines:
    web_sales:
      name: web_sales_medallion
      catalog: ${var.catalog}
      # Default schema for unqualified datasets. Each SQL file still qualifies its own
      # bronze/silver/gold schema, so tables land in the right layer.
      schema: gold
      serverless: true
      continuous: false
      configuration:
        source_schema: ${var.source_schema}
      libraries:
        - glob:
            include: ../src/web_sales/**
