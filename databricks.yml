# Databricks Asset Bundle for the store-sales demo on the TPC-DS sample.
# Deploy: databricks bundle deploy --target meetup   (or --target free)
# Run:    databricks bundle run store_sales --target meetup
bundle:
  name: dbx_meetup_demo

variables:
  catalog:
    description: Unity Catalog catalog that holds the bronze, silver, and gold schemas.
    # Free Edition gives one writable catalog named workspace.
    default: workspace
  source_schema:
    description: >-
      Catalog.schema that holds the TPC-DS source tables the bronze layer reads.
      Default is the 1 GB sf1 sample, which builds on Databricks Free Edition; set to
      samples.tpcds_sf1000 for realistic 1 TB volume.
    default: samples.tpcds_sf1

include:
  - resources/*.yml

# The demo is shared with other workspace users (see the dev target's shared root_path).
# Grant the users group manage access so the shared deploy is explicit and governed.
permissions:
  - level: CAN_MANAGE
    group_name: users

# One target per Databricks workspace. Each pins its own host, so bundle state and the
# deploy folder stay separate per workspace. Reusing one target across workspaces leaks
# state between them. Deploy with `databricks bundle deploy -t <target>`; the CLI picks
# the login profile whose host matches.
#
#   databricks bundle deploy -t meetup   # dbc-6e62e3ed-79ce (default)
#   databricks bundle deploy -t free     # dbc-e968297e-f78a
#
# No `mode: development`: development mode forces a per-user root_path (it must contain
# the username), which cannot be a shared folder, and it prefixes resource names per
# user. A shared demo wants one stable deploy location and stable names. ${bundle.target}
# keeps each workspace's files in its own folder.
targets:
  meetup:
    default: true
    workspace:
      host: https://dbc-6e62e3ed-79ce.cloud.databricks.com
      root_path: /Workspace/Shared/dbx_meetup_demo/${bundle.target}
  free:
    workspace:
      host: https://dbc-e968297e-f78a.cloud.databricks.com
      root_path: /Workspace/Shared/dbx_meetup_demo/${bundle.target}
