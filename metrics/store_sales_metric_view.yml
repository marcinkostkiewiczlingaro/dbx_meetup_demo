# Databricks Metric View: governed bakery-sales metrics defined once.
# Create in Unity Catalog on top of the wide gold table. Genie and BI read these names.
# Each measure name is the one business term; the ontology and semantic model match it.
# Source is gold.sales_enriched (the fact widened with descriptive columns), so the
# metric view needs no joins.
version: 0.1

source: workspace.gold.sales_enriched

dimensions:
  - name: Sold Date
    expr: sold_date
  - name: Month Name
    expr: month_name
  - name: Product
    expr: product_name
  - name: Payment Method
    expr: payment_method
  - name: Franchise
    expr: franchise_name
  - name: Franchise Country
    expr: franchise_country
  - name: Customer Country
    expr: customer_country

measures:
  - name: Total Revenue
    expr: SUM(sales_amount)
  - name: Quantity Sold
    expr: SUM(quantity)
  - name: Transaction Count
    expr: COUNT(DISTINCT sales_transaction_id)
  - name: Average Transaction Value
    expr: SUM(sales_amount) / COUNT(DISTINCT sales_transaction_id)
  - name: Units per Transaction
    expr: SUM(quantity) / COUNT(DISTINCT sales_transaction_id)
