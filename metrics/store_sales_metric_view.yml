# Databricks Metric View: governed bakery-sales metrics defined once.
# Create in Unity Catalog on top of the gold fact. Genie and BI read these names.
# Each measure name is the one business term; the ontology and semantic model match it.
version: 0.1

source: workspace.gold.fct_sales

joins:
  - name: customer
    source: workspace.gold.dim_customer
    on: source.customer_key = customer.customer_key
  - name: franchise
    source: workspace.gold.dim_franchise
    on: source.franchise_key = franchise.franchise_key
  - name: date
    source: workspace.gold.dim_date
    on: source.sold_date = date.sold_date

dimensions:
  - name: Sold Date
    expr: source.sold_date
  - name: Month Name
    expr: date.month_name
  - name: Product
    expr: source.product_name
  - name: Payment Method
    expr: source.payment_method
  - name: Franchise
    expr: franchise.franchise_name
  - name: Franchise Country
    expr: franchise.country
  - name: Customer Country
    expr: customer.country

measures:
  - name: Total Revenue
    expr: SUM(sales_amount)
  - name: Quantity Sold
    expr: SUM(quantity)
  - name: Transaction Count
    expr: COUNT(DISTINCT sales_transaction_id)
  - name: Average Transaction Value
    expr: SUM(sales_amount) / COUNT(DISTINCT sales_transaction_id)
  - name: Units per Transaction
    expr: SUM(quantity) / COUNT(DISTINCT sales_transaction_id)
